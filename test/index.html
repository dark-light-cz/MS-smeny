<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testy – MS-smeny</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 1rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }
    .test-ok { color: #0a0; }
    .test-fail { color: #c00; }
    .summary { margin: 1rem 0; padding: 0.5rem; border-radius: 4px; }
    .summary.all-pass { background: #e8f5e9; }
    .summary.has-fail { background: #ffebee; }
  </style>
</head>
<body>
  <h1>Testy MS-smeny</h1>
  <p>Spouštění testů datového modelu a Local Storage. Otevřete konzoli (F12) pro výstup.</p>
  <div id="vysledek"></div>

  <!-- DOM scaffold pro testy zaměstnanců (B1d) – potřeba před načtením zamestnanci.js, aby init() připnula listenery -->
  <div id="test-scaffold-zamestnanci" hidden>
    <button type="button" id="zamestnanci-pridat"></button>
    <div id="zamestnanci-modal" hidden>
      <div class="zamestnanci-modal-obal">
      <form id="zamestnanci-form">
        <input type="hidden" id="zamestnanci-form-id" value="">
        <input type="text" id="zamestnanci-jmeno" value="">
        <div id="zamestnanci-role-uvazky-seznam" class="role-uvazky-seznam"></div>
        <button type="button" id="zamestnanci-pridat-roli">Přidat roli</button>
        <input type="radio" name="zamestnanci-kategorie" value="kmenová" id="zamestnanci-kmenova">
        <input type="radio" name="zamestnanci-kategorie" value="vykrývací" id="zamestnanci-vykryvaci">
        <p id="zamestnanci-trida-wrapper"><select id="zamestnanci-trida"><option value="">—</option></select></p>
        <div id="nedostupnost-seznam"></div>
        <select id="nedostupnost-den">
          <option value="1">Pondělí</option>
          <option value="2">Úterý</option>
          <option value="3">Středa</option>
          <option value="4">Čtvrtek</option>
          <option value="5">Pátek</option>
        </select>
        <input type="time" id="nedostupnost-od" value="07:00">
        <input type="time" id="nedostupnost-do" value="17:00">
        <button type="button" id="nedostupnost-btn-pridat">Přidat</button>
        <button type="button" id="nedostupnost-btn-cely-den">Celý den</button>
        <select id="zamestnanci-prechod-budovy">
          <option value="výchozí">Výchozí (dle globálního nastavení)</option>
          <option value="zakázat">Zakázat</option>
          <option value="povolit">Povolit</option>
        </select>
        <button type="button" id="zamestnanci-form-zrusit">Zrušit</button>
      </form>
      </div>
    </div>
    <div id="zamestnanci-seznam"></div>
  </div>

  <!-- Pořadí: model → storage → export-import → navigace → runner → testy -->
  <script src="../js/data-model.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/export-import.js"></script>
  <script src="../js/navigace.js"></script>
  <script src="../js/zamestnanci.js"></script>
  <script src="../js/budovy-tridy.js"></script>
  <script src="../js/min-max-sloty.js"></script>
  <script src="../js/algoritmy/zakladni.js"></script>
  <script src="../js/algoritmy/parove-tridy.js"></script>
  <script src="../js/algoritmy/registr.js"></script>
  <script src="../js/vypocet-smen.js"></script>
  <script src="../js/navrh-smen-ui.js"></script>
  <script src="../js/navrh-graf.js"></script>
  <script src="../js/export-navrh-csv.js"></script>
  <script src="../js/import-navrh-csv.js"></script>
  <script src="../js/validace-navrhu.js"></script>
  <script src="test-runner.js"></script>
  <script>
    window.MSemenyTestList = [];
  </script>
  <script src="test-data-model.js"></script>
  <script src="test-storage.js"></script>
  <script src="test-export-import.js"></script>
  <script src="test-navigace.js"></script>
  <script src="test-zamestnanci.js"></script>
  <script src="test-budovy-tridy.js"></script>
  <script src="test-min-max-sloty.js"></script>
  <script src="test-pravidla-prekryv.js"></script>
  <script src="test-algoritmy-registr.js"></script>
  <script src="test-parove-tridy.js"></script>
  <script src="test-vypocet-smen.js"></script>
  <script src="test-export-navrh-csv.js"></script>
  <script src="test-import-navrh-csv.js"></script>
  <script src="test-validace-navrhu.js"></script>
  <script src="test-navrh-graf.js"></script>
  <script src="test-navrh-smen-ui.js"></script>
  <script>
    (function () {
      var result = window.MSemenyTest.runTests(window.MSemenyTestList);
      var html = window.MSemenyTest.report(result, true);
      var el = document.getElementById('vysledek');
      el.className = 'summary ' + (result.failed === 0 ? 'all-pass' : 'has-fail');
      el.innerHTML = html;
      window.__MSemenyTestResult = result;
    })();
  </script>
</body>
</html>
